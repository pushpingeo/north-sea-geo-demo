name = "north-sea-geo-demo"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
MAX_TOKENS = "8000"
# Your GitHub Pages address, no trailing slash. Add http://localhost:8000 for local testing.
ALLOWED_ORIGINS = "https://pushpingeo.github.io"
# Each question uses about 7-10 requests: one to write the spec, then 2-3 for each engine.
PER_VISITOR_DAILY = "200"
TOTAL_DAILY = "5000"
# Tobler's map searches through the atlas (no Anthropic cost; one search is up to ~20 calls).
ATLAS_PER_VISITOR_DAILY = "2000"

[[kv_namespaces]]
binding = "LIMITS"
id = "PASTE_THE_ID_FROM_wrangler_kv_namespace_create"

# The API key is a secret, not a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ATLAS_MCP_KEY      (Tobler's /atlas route)

# Tobler's /atlas route reaches the atlas Worker directly (workers.dev fetches between Workers on one account fail with 1042).
[[services]]
binding = "ATLAS"
service = "atlas-mcp"

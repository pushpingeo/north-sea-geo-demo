name = "north-sea-geo-demo"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
# Your GitHub Pages address, no trailing slash. Add http://localhost:8000 for local testing.
ALLOWED_ORIGINS = "https://pushpingeo.github.io"
# Each question uses about 2-3 requests (Claude asks, the engine runs, Claude answers).
PER_VISITOR_DAILY = "60"
TOTAL_DAILY = "3000"

[[kv_namespaces]]
binding = "LIMITS"
id = "PASTE_THE_ID_FROM_wrangler_kv_namespace_create"

# The API key is a secret, not a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
